# GitHub Pages (Jekyll): renders README.md as the landing page and adds SEO meta tags
# (title, description, canonical URL, Open Graph, Twitter card, JSON-LD) via jekyll-seo-tag.
title: lima-docker-lean
tagline: Docker on macOS with near-zero idle cost
description: >-
  Measured Lima template for Docker on Apple Silicon Macs: 0 idle disk writes, ~1% idle CPU,
  half the RAM held after load. Compared with OrbStack, Apple container, Colima.
url: "https://heaprip.github.io"
baseurl: "/lima-docker-lean"
lang: en
author: heaprip
github:
  repository_url: "https://github.com/heaprip/lima-docker-lean"
twitter:
  card: summary
defaults:
  - scope: {path: "README.ru.md"}
    values: {lang: ru, description: "Замеренный шаблон Lima для Docker на Mac с Apple Silicon: 0 записи на диск и ~1% CPU в простое, вдвое меньше RAM после нагрузки."}
  - scope: {path: "docs/ru"}
    values: {lang: ru}
# Upstream primer takes <html lang> from page.lang; the built-in Pages copy only reads site.lang.
remote_theme: pages-themes/primer@v0.6.0
plugins:
  - jekyll-remote-theme
  - jekyll-titles-from-headings
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-sitemap
relative_links:
  enabled: true
  collections: false
exclude:
  - bench/fdbpy
