# GitHub Pages (Jekyll): renders README.md as the landing page and adds SEO meta tags
# (title, description, canonical URL, Open Graph, Twitter card, JSON-LD) via jekyll-seo-tag.
title: "lima-docker-lean: Docker on macOS with near-zero idle cost"
description: >-
  Measured, minimal Docker host for Apple Silicon Macs on Lima and Virtualization.framework:
  0 idle disk writes, ~1% of a core idle, about half the RAM held after load thanks to
  init_on_free. Real Docker Engine API for testcontainers, compose and werf.
  Compared with Apple container, OrbStack, Colima, Podman, LinuxKit. EN/RU.
url: "https://heaprip.github.io"
baseurl: "/lima-docker-lean"
lang: en
author: heaprip
github:
  repository_url: "https://github.com/heaprip/lima-docker-lean"
twitter:
  card: summary
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-sitemap
relative_links:
  enabled: true
  collections: false
exclude:
  - bench/fdbpy
